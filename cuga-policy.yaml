version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /app
    - /bin
    - /etc
    - /lib
    - /proc
    - /sys
    - /usr
    - /var/log
    - /dev/urandom
  read_write:
    - /sandbox
    - /tmp
    - /dev/null

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  openshell_inference:
    name: openshell-inference-local
    endpoints:
      - host: inference.local
        port: 443
        protocol: rest
        enforcement: enforce
        access: read-write
    binaries:
      - { path: /app/.venv/bin/python }
      - { path: /app/.venv/bin/python* }
      - { path: /app/.venv/bin/cuga }
      - { path: /usr/local/bin/cuga-openshell-demo }

  cuga_local_services:
    name: cuga-local-services
    endpoints:
      - host: 127.0.0.1
        port: 7860
        protocol: rest
        enforcement: enforce
        access: full
      - host: 127.0.0.1
        port: 8001
        protocol: rest
        enforcement: enforce
        access: full
      - host: 127.0.0.1
        port: 8007
        protocol: rest
        enforcement: enforce
        access: full
      - host: localhost
        port: 7860
        protocol: rest
        enforcement: enforce
        access: full
      - host: localhost
        port: 8001
        protocol: rest
        enforcement: enforce
        access: full
      - host: localhost
        port: 8007
        protocol: rest
        enforcement: enforce
        access: full
    binaries:
      - { path: /app/.venv/bin/python }
      - { path: /app/.venv/bin/python* }
      - { path: /app/.venv/bin/cuga }
      - { path: /usr/local/bin/cuga-openshell-demo }
